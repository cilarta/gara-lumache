<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Gara di Lumache - Giocatore</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            text-align: center;
            background-color: #f4f4f9;
            padding: 20px;
            margin: 0;
        }
        input, button, select {
            padding: 15px;
            margin: 10px 0;
            width: 90%;
            font-size: 18px;
            border-radius: 8px;
            border: 1px solid #ccc;
        }
        button {
            background-color: #28a745;
            color: white;
            font-weight: bold;
            border: none;
            cursor: pointer;
        }
        #game-screen {
            display: none;
        }
        .progress-bar-container {
            width: 100%;
            height: 30px;
            background-color: #ddd;
            border-radius: 15px;
            overflow: hidden;
            margin-top: 20px;
        }
        .progress-bar {
            height: 100%;
            width: 0%;
            background-color: #ff9800;
            transition: width 0.2s;
        }
        .status {
            font-size: 24px;
            font-weight: bold;
            margin-top: 20px;
        }
        #my-snail {
            font-size: 50px;
            margin: 20px;
            display: inline-block;
            transition: transform 0.1s;
        }
    </style>
</head>
<body>

    <div id="login-screen">
        <h2>Prepara la tua Lumaca!</h2>
        <input type="text" id="playerName" placeholder="Nome della lumaca" maxlength="10">
        <select id="playerColor">
            <option value="#ff0000">Rosso</option>
            <option value="#0000ff">Blu</option>
            <option value="#ff69b4">Rosa</option>
            <option value="#800080">Viola</option>
            <option value="#ffa500">Arancione</option>
            <option value="#000000">Nero</option>
        </select>
        <button onclick="joinGame()">Entra in Gara!</button>
        <p><small>Verrà richiesto l'accesso al microfono per far muovere la lumaca urlando.</small></p>
    </div>

    <div id="game-screen">
        <h2 id="rank-display">Posizione: --</h2>
        <div id="my-snail">🐌</div>
        <p><strong>URLA PER FARLA MUOVERE!</strong></p>
        
        <div class="progress-bar-container">
            <div id="progress" class="progress-bar"></div>
        </div>
        <p id="distance-text">Strada percorsa: 0%</p>
    </div>

    <script>
        // LA TUA CONFIGURAZIONE FIREBASE
        const firebaseConfig = {
            apiKey: "AIzaSyAD7k9EhLPFZZjQuV3va9ig7JHYZHir6Ro",
            authDomain: "corsa-delle-lumache-c7898.firebaseapp.com",
            databaseURL: "https://corsa-delle-lumache-c7898-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "corsa-delle-lumache-c7898",
            storageBucket: "corsa-delle-lumache-c7898.firebasestorage.app",
            messagingSenderId: "13626588351",
            appId: "1:13626588351:web:027604fd9ad659b4855a0a"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        const urlParams = new URLSearchParams(window.location.search);
        const roomId = urlParams.get('room');
        const playerId = 'player_' + Math.random().toString(36).substr(2, 9);
        
        let myScore = 0;
        const maxScore = 15000; 

        async function joinGame() {
            const name = document.getElementById('playerName').value;
            const color = document.getElementById('playerColor').value;

            if (!name) return alert("Inserisci un nome!");
            if (!roomId) return alert("Devi inquadrare il QR code dallo schermo principale per giocare!");

            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                
                document.getElementById('login-screen').style.display = 'none';
                document.getElementById('game-screen').style.display = 'block';

                db.ref(`rooms/${roomId}/players/${playerId}`).set({
                    name: name,
                    color: color,
                    score: 0
                });

                startListening(stream);
                trackRankings();

            } catch (err) {
                alert("Devi consentire l'accesso al microfono per giocare!");
            }
        }

        function startListening(stream) {
            const audioContext = new (window.AudioContext || window.webkitAudioContext)();
            const analyser = audioContext.createAnalyser();
            const microphone = audioContext.createMediaStreamSource(stream);
            
            microphone.connect(analyser);
            analyser.fftSize = 256;
            const bufferLength = analyser.frequencyBinCount;
            const dataArray = new Uint8Array(bufferLength);
            
            const snailEmoji = document.getElementById('my-snail');

            setInterval(() => {
                analyser.getByteFrequencyData(dataArray);
                let sum = 0;
                for(let i = 0; i < bufferLength; i++) {
                    sum += dataArray[i];
                }
                let volume = sum / bufferLength;

                if (volume > 20) {
                    myScore += (volume / 2); 
                    if (myScore > maxScore) myScore = maxScore;

                    db.ref(`rooms/${roomId}/players/${playerId}/score`).set(myScore);

                    let progressPercent = (myScore / maxScore) * 100;
                    document.getElementById('progress').style.width = progressPercent + '%';
                    document.getElementById('distance-text').innerText = `Strada percorsa: ${Math.floor(progressPercent)}%`;
                    
                    // Piccola animazione della lumaca sul telefono quando si urla
                    snailEmoji.style.transform = `scale(${1 + (volume/100)}) rotate(${(Math.random() * 10) - 5}deg)`;
                } else {
                    snailEmoji.style.transform = "scale(1) rotate(0deg)";
                }
            }, 100);
        }

        function trackRankings() {
            db.ref(`rooms/${roomId}/players`).on('value', (snapshot) => {
                const players = snapshot.val();
                if (!players) return;

                let leaderboard = [];
                for (let key in players) {
                    leaderboard.push({ id: key, score: players[key].score });
                }
                
                leaderboard.sort((a, b) => b.score - a.score);

                const myRank = leaderboard.findIndex(p => p.id === playerId) + 1;
                document.getElementById('rank-display').innerText = `Posizione: ${myRank}°`;
            });
        }
    </script>
</body>
</html>
