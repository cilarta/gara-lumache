<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Gara di Lumache</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    
    <style>
        body { margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; touch-action: manipulation; }
        
        /* HOST */
        #host-view { display: none; overflow: hidden; background: linear-gradient(to bottom, #87CEEB 0%, #E0F6FF 60%, #7CFC00 60%, #228B22 100%); height: 100vh; position: relative; }
        #header { text-align: center; padding: 15px; background: rgba(255, 255, 255, 0.9); border-bottom: 3px solid #333; }
        #qr-container { position: absolute; top: 20px; right: 20px; background: white; padding: 10px; border-radius: 10px; text-align: center; z-index: 10; box-shadow: 0 4px 8px rgba(0,0,0,0.2); }
        #qrcode-img { width: 130px; height: 130px; }
        .track { position: relative; height: 60px; border-bottom: 2px dashed rgba(255, 255, 255, 0.5); margin-top: 10px; }
        .snail { position: absolute; top: 10px; left: 0; width: 50px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: bold; color: white; text-shadow: 1px 1px 2px black; transition: left 0.2s linear; font-size: 20px; }

        /* CLIENT */
        #client-view { display: none; text-align: center; background-color: #f4f4f9; min-height: 100vh; padding: 20px; box-sizing: border-box; }
        input, button { padding: 15px; margin: 10px 0; width: 90%; font-size: 18px; border-radius: 8px; border: 1px solid #ccc; }
        
        .color-picker { display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; margin-bottom: 20px; }
        .color-option { width: 55px; height: 55px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 24px; cursor: pointer; border: 3px solid transparent; transition: all 0.2s; background-color: #ddd; }
        .color-option.selected { border-color: #27ae60; transform: scale(1.1); box-shadow: 0 0 10px rgba(0,0,0,0.3); }

        .btn-join { background-color: #28a745; color: white; font-weight: bold; border: none; }
        .btn-edit { background-color: #7f8c8d; color: white; font-size: 14px; width: auto; padding: 10px 20px; }

        .progress-bar-container { width: 100%; height: 25px; background-color: #ddd; border-radius: 12px; overflow: hidden; margin: 20px 0; }
        .progress-bar { height: 100%; width: 0%; background-color: #ff9800; transition: width 0.2s; }
        #my-snail { font-size: 60px; margin: 20px auto; width: 100px; height: 100px; border-radius: 50%; display: flex; align-items: center; justify-content: center; }
    </style>
</head>
<body>

    <div id="host-view">
        <div id="header">
            <h1 id="winner-text">🐌 Gara di Lumache!</h1>
            <button id="start-btn" onclick="startRaceHost()">🚀 INIZIA LA GARA! 🚀</button>
        </div>
        <div id="qr-container">
            <img id="qrcode-img" src="" alt="QR">
            <p id="room-link-text" style="font-size: 10px;"></p>
        </div>
        <div id="race-track"></div>
    </div>

    <div id="client-view">
        <div id="login-screen">
            <h2>Personalizza Lumaca</h2>
            
            <p>1. Scegli il colore:</p>
            <div class="color-picker" id="color-container"></div>
            
            <p>2. Inserisci il nome:</p>
            <input type="text" id="playerName" placeholder="Tuo Nome..." maxlength="10">
            
            <button class="btn-join" onclick="joinGameClient()">ENTRA IN GARA! 🏁</button>
        </div>

        <div id="game-screen" style="display: none;">
            <h2 id="rank-display">Posizione: --</h2>
            <div id="my-snail">🐌</div>
            <p id="game-status-text">In attesa dell'Host...</p>
            <div class="progress-bar-container"><div id="progress" class="progress-bar"></div></div>
            <button class="btn-edit" id="btn-edit" onclick="editProfile()">⚙️ Modifica Colore/Nome</button>
        </div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const roomIdParam = urlParams.get('room');
        let globalHostRoomId = null;

        // Configurazione Firebase
        const firebaseConfig = {
            apiKey: "AIzaSyAD7k9EhLPFZZjQuV3va9ig7JHYZHir6Ro",
            authDomain: "corsa-delle-lumache-c7898.firebaseapp.com",
            databaseURL: "https://corsa-delle-lumache-c7898-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "corsa-delle-lumache-c7898",
            storageBucket: "corsa-delle-lumache-c7898.firebasestorage.app",
            messagingSenderId: "13626588351",
            appId: "1:13626588351:web:027604fd9ad659b4855a0a"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        if (roomIdParam) {
            document.getElementById('client-view').style.display = 'block';
            initClient(roomIdParam);
        } else {
            document.getElementById('host-view').style.display = 'block';
            globalHostRoomId = Math.random().toString(36).substring(2, 8);
            const clientLink = window.location.href.split('?')[0] + "?room=" + globalHostRoomId;
            document.getElementById('room-link-text').innerText = clientLink;
            document.getElementById('qrcode-img').src = "https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=" + encodeURIComponent(clientLink);
            initHost(globalHostRoomId);
        }

        // --- LOGICA HOST ---
        function initHost(rid) {
            db.ref('rooms/' + rid + '/status').set('waiting');
            db.ref('rooms/' + rid + '/players').on('value', snap => {
                const players = snap.val();
                const trackDiv = document.getElementById('race-track');
                trackDiv.innerHTML = '';
                if(!players) return;
                Object.keys(players).forEach(id => {
                    const p = players[id];
                    const tr = document.createElement('div');
                    tr.className = 'track';
                    const s = document.createElement('div');
                    s.className = 'snail';
                    s.style.backgroundColor = p.color;
                    s.style.left = (p.score / 15000 * 90) + '%';
                    s.innerHTML = `🐌<br><small style="color:black; background:white; padding:2px;">${p.name}</small>`;
                    tr.appendChild(s);
                    trackDiv.appendChild(tr);
                    if(p.score >= 15000) {
                        document.getElementById('winner-text').innerText = "🏆 VINCE " + p.name + "!";
                        db.ref('rooms/' + rid + '/status').set('finished');
                    }
                });
            });
        }
        function startRaceHost() { db.ref('rooms/' + globalHostRoomId + '/status').set('playing'); document.getElementById('start-btn').style.display='none'; }

        // --- LOGICA CLIENT ---
        let pId = 'p_' + Math.random().toString(36).substr(2, 5);
        let selCol = '#ff0000';
        let score = 0;
        let rStatus = 'waiting';

        function initClient(rid) {
            const colors = ['#ff0000', '#0000ff', '#ff69b4', '#800080', '#ffa500', '#333333', '#00cc00', '#00cccc'];
            const container = document.getElementById('color-container');
            colors.forEach(c => {
                const d = document.createElement('div');
                d.className = 'color-option' + (c==='#ff0000'?' selected':'');
                d.style.backgroundColor = c;
                d.innerText = '🐌';
                d.onclick = () => {
                    document.querySelectorAll('.color-option').forEach(e => { e.classList.remove('selected'); e.innerText='🐌'; });
                    d.classList.add('selected');
                    d.innerText = '✅';
                    selCol = c;
                    document.activeElement.blur(); // Chiude tastiera se aperta
                };
                container.appendChild(d);
            });

            db.ref(`rooms/${rid}/status`).on('value', snap => {
                rStatus = snap.val();
                document.getElementById('game-status-text').innerText = rStatus === 'playing' ? "URRAAAAAAA! 📢" : (rStatus === 'finished' ? "Fine gara!" : "In attesa dell'Host...");
                document.getElementById('btn-edit').style.display = rStatus === 'waiting' ? 'inline-block' : 'none';
            });
        }

        async function joinGameClient() {
            const name = document.getElementById('playerName').value;
            if(!name) return alert("Inserisci un nome!");
            document.activeElement.blur(); // Chiude tastiera

            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                document.getElementById('login-screen').style.display = 'none';
                document.getElementById('game-screen').style.display = 'block';
                document.getElementById('my-snail').style.backgroundColor = selCol;
                
                db.ref(`rooms/${roomIdParam}/players/${pId}`).update({ name: name, color: selCol, score: 0 });
                startMic(stream);
            } catch (e) { alert("Attiva il microfono!"); }
        }

        function editProfile() {
            document.getElementById('login-screen').style.display = 'block';
            document.getElementById('game-screen').style.display = 'none';
        }

        function startMic(stream) {
            const ctx = new AudioContext();
            const ana = ctx.createAnalyser();
            ctx.createMediaStreamSource(stream).connect(ana);
            setInterval(() => {
                const data = new Uint8Array(ana.frequencyBinCount);
                ana.getByteFrequencyData(data);
                let vol = data.reduce((a,b) => a+b) / data.length;
                if(vol > 25 && rStatus === 'playing') {
                    score += vol/2;
                    db.ref(`rooms/${roomIdParam}/players/${pId}`).update({ score: score });
                    document.getElementById('progress').style.width = (score/15000*100) + '%';
                    document.getElementById('my-snail').style.transform = `scale(${1+vol/100})`;
                }
            }, 100);
        }
    </script>
</body>
</html>
