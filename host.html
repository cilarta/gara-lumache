<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>Gara di Lumache - Host</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(to bottom, #87CEEB 0%, #E0F6FF 60%, #7CFC00 60%, #228B22 100%);
            height: 100vh;
        }
        #header {
            text-align: center;
            padding: 20px;
            background: rgba(255, 255, 255, 0.8);
            border-bottom: 3px solid #333;
        }
        #qr-container {
            position: absolute;
            top: 20px;
            right: 20px;
            background: white;
            padding: 10px;
            border-radius: 10px;
            text-align: center;
        }
        .track {
            position: relative;
            height: 60px;
            border-bottom: 2px dashed rgba(255, 255, 255, 0.5);
            margin-top: 10px;
        }
        .snail {
            position: absolute;
            top: 10px;
            left: 0;
            width: 50px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            color: white;
            text-shadow: 1px 1px 2px black;
            transition: left 0.2s linear;
            z-index: 2;
        }
        .finish-line {
            position: absolute;
            right: 50px;
            top: 0;
            bottom: 0;
            width: 10px;
            background: repeating-linear-gradient(45deg, white, white 10px, black 10px, black 20px);
            z-index: 1;
        }
    </style>
</head>
<body>

    <div id="header">
        <h1>🐌 Gara di Lumache! 🐌</h1>
        <h2 id="winner-text">Inquadra il QR Code per partecipare!</h2>
    </div>

    <div id="qr-container">
        <img id="qrcode" src="" alt="QR Code">
        <p>Inquadrami!</p>
    </div>

    <div id="race-track" style="margin-top: 100px; position: relative; height: calc(100vh - 150px);">
        </div>

    <script>
        // LA TUA CONFIGURAZIONE FIREBASE
        const firebaseConfig = {
            apiKey: "AIzaSyAD7k9EhLPFZZjQuV3va9ig7JHYZHir6Ro",
            authDomain: "corsa-delle-lumache-c7898.firebaseapp.com",
            databaseURL: "https://corsa-delle-lumache-c7898-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "corsa-delle-lumache-c7898",
            storageBucket: "corsa-delle-lumache-c7898.firebasestorage.app",
            messagingSenderId: "13626588351",
            appId: "1:13626588351:web:027604fd9ad659b4855a0a"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        const roomId = Math.random().toString(36).substring(2, 8);
        
        // Questo genererà il link per il telefono in base a dove ospiterai il sito
        const currentUrl = window.location.href.split('host.html')[0];
        const clientLink = `${currentUrl}client.html?room=${roomId}`;
        
        document.getElementById('qrcode').src = `https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=${encodeURIComponent(clientLink)}`;

        const raceTrack = document.getElementById('race-track');
        const maxScore = 15000; 
        let raceFinished = false;

        // Aggiungo subito la linea del traguardo
        const finishLine = document.createElement('div');
        finishLine.className = 'finish-line';
        raceTrack.appendChild(finishLine);

        db.ref('rooms/' + roomId + '/players').on('value', (snapshot) => {
            const players = snapshot.val();
            if (!players) return;

            // Rimuovo le vecchie lumache ma tengo il traguardo
            const tracks = document.querySelectorAll('.track');
            tracks.forEach(t => t.remove());

            Object.keys(players).forEach(playerId => {
                const p = players[playerId];
                
                const track = document.createElement('div');
                track.className = 'track';

                const snail = document.createElement('div');
                snail.className = 'snail';
                snail.style.backgroundColor = p.color;
                snail.innerText = p.name.substring(0, 3); 
                
                let progressPercent = (p.score / maxScore) * 100;
                if (progressPercent > 90) progressPercent = 90; 
                
                snail.style.left = `calc(${progressPercent}% - 50px)`;
                
                track.appendChild(snail);
                raceTrack.appendChild(track);

                if (p.score >= maxScore && !raceFinished) {
                    raceFinished = true;
                    document.getElementById('winner-text').innerText = `🏆 HA VINTO ${p.name.toUpperCase()}! 🏆`;
                }
            });
        });

        window.onbeforeunload = function() {
            db.ref('rooms/' + roomId).remove();
        };
    </script>
</body>
</html>
