<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Gara di Lumache</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <style>
        /* STILI GENERALI */
        body { margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        
        /* STILI HOST */
        #host-view {
            display: none;
            overflow: hidden;
            background: linear-gradient(to bottom, #87CEEB 0%, #E0F6FF 60%, #7CFC00 60%, #228B22 100%);
            height: 100vh;
            position: relative;
        }
        #header {
            text-align: center;
            padding: 15px;
            background: rgba(255, 255, 255, 0.9);
            border-bottom: 3px solid #333;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        #qr-container {
            position: absolute;
            top: 20px;
            right: 20px;
            background: white;
            padding: 10px;
            border-radius: 10px;
            text-align: center;
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
            z-index: 10;
        }
        #start-btn {
            background-color: #e74c3c;
            color: white;
            font-size: 24px;
            font-weight: bold;
            padding: 15px 30px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            margin-top: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
            transition: transform 0.1s;
        }
        #start-btn:active { transform: scale(0.95); }
        .track {
            position: relative;
            height: 60px;
            border-bottom: 2px dashed rgba(255, 255, 255, 0.5);
            margin-top: 10px;
        }
        .snail {
            position: absolute;
            top: 10px;
            left: 0;
            width: 50px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            color: white;
            text-shadow: 1px 1px 2px black;
            transition: left 0.2s linear;
            z-index: 2;
            font-size: 20px;
        }
        .finish-line {
            position: absolute;
            right: 50px;
            top: 0;
            bottom: 0;
            width: 10px;
            background: repeating-linear-gradient(45deg, white, white 10px, black 10px, black 20px);
            z-index: 1;
        }

        /* STILI CLIENT (GIOCATORI) */
        #client-view {
            display: none;
            text-align: center;
            background-color: #f4f4f9;
            min-height: 100vh;
            padding: 20px;
            box-sizing: border-box;
        }
        input, button {
            padding: 15px;
            margin: 10px 0;
            width: 90%;
            font-size: 18px;
            border-radius: 8px;
            border: 1px solid #ccc;
        }
        .btn-join {
            background-color: #28a745;
            color: white;
            font-weight: bold;
            border: none;
            cursor: pointer;
            margin-top: 20px;
        }
        .color-picker {
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
            margin: 20px 0;
        }
        .color-option {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 30px;
            cursor: pointer;
            border: 4px solid transparent;
            transition: transform 0.2s;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .color-option.selected {
            border-color: #333;
            transform: scale(1.15);
        }
        .progress-bar-container {
            width: 100%;
            height: 30px;
            background-color: #ddd;
            border-radius: 15px;
            overflow: hidden;
            margin-top: 20px;
        }
        .progress-bar {
            height: 100%;
            width: 0%;
            background-color: #ff9800;
            transition: width 0.2s;
        }
        #my-snail {
            font-size: 70px;
            margin: 20px;
            display: inline-block;
            transition: transform 0.1s;
        }
        #game-status-text {
            color: #d35400;
            font-size: 22px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div id="host-view">
        <div id="header">
            <h1>🐌 Gara di Lumache! 🐌</h1>
            <h2 id="winner-text">In attesa dei giocatori...</h2>
            <button id="start-btn" onclick="startRaceHost()">🚀 INIZIA LA GARA! 🚀</button>
        </div>

        <div id="qr-container">
            <img id="qrcode" src="" alt="QR Code">
            <p><strong>Inquadrami<br>per giocare!</strong></p>
        </div>

        <div id="race-track" style="margin-top: 20px; position: relative; height: calc(100vh - 200px);">
            </div>
    </div>

    <div id="client-view">
        <div id="login-screen">
            <h2>Prepara la tua Lumaca!</h2>
            <input type="text" id="playerName" placeholder="Nome (max 10 lett.)" maxlength="10">
            
            <h3>Scegli il colore:</h3>
            <div class="color-picker" id="color-container">
                </div>

            <button class="btn-join" onclick="joinGameClient()">Entra in Gara!</button>
            <p><small>Verrà richiesto l'accesso al microfono.</small></p>
        </div>

        <div id="game-screen" style="display: none;">
            <h2 id="rank-display">Posizione: --</h2>
            <div id="my-snail">🐌</div>
            <p id="game-status-text">In attesa che l'Host avvii la gara...</p>
            
            <div class="progress-bar-container">
                <div id="progress" class="progress-bar"></div>
            </div>
            <p id="distance-text">Strada percorsa: 0%</p>
        </div>
    </div>

    <script>
        // CONFIGURAZIONE FIREBASE
        const firebaseConfig = {
            apiKey: "AIzaSyAD7k9EhLPFZZjQuV3va9ig7JHYZHir6Ro",
            authDomain: "corsa-delle-lumache-c7898.firebaseapp.com",
            databaseURL: "https://corsa-delle-lumache-c7898-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "corsa-delle-lumache-c7898",
            storageBucket: "corsa-delle-lumache-c7898.firebasestorage.app",
            messagingSenderId: "13626588351",
            appId: "1:13626588351:web:027604fd9ad659b4855a0a"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        // CONTROLLO URL: Host o Client?
        const urlParams = new URLSearchParams(window.location.search);
        const roomIdParam = urlParams.get('room');
        const maxScore = 15000; 

        if (roomIdParam) {
            // SE C'È ?room=... NELL'URL -> MOSTRA IL CLIENT
            document.getElementById('client-view').style.display = 'block';
            initClient(roomIdParam);
        } else {
            // SE NON C'È -> MOSTRA L'HOST
            document.getElementById('host-view').style.display = 'block';
            initHost();
        }

        // ================= FUNZIONI HOST =================
        let hostRoomId;
        function initHost() {
            hostRoomId = Math.random().toString(36).substring(2, 8);
            
            // Imposta lo stato iniziale
            db.ref('rooms/' + hostRoomId + '/status').set('waiting');

            const currentUrl = window.location.href.split('?')[0]; // Prende url base
            const clientLink = `${currentUrl}?room=${hostRoomId}`;
            
            document.getElementById('qrcode').src = `https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=${encodeURIComponent(clientLink)}`;

            const raceTrack = document.getElementById('race-track');
            let raceFinished = false;

            const finishLine = document.createElement('div');
            finishLine.className = 'finish-line';
            raceTrack.appendChild(finishLine);

            db.ref('rooms/' + hostRoomId + '/players').on('value', (snapshot) => {
                const players = snapshot.val();
                if (!players) return;

                const tracks = document.querySelectorAll('.track');
                tracks.forEach(t => t.remove());

                Object.keys(players).forEach(playerId => {
                    const p = players[playerId];
                    
                    const track = document.createElement('div');
                    track.className = 'track';

                    const snail = document.createElement('div');
                    snail.className = 'snail';
                    snail.style.backgroundColor = p.color;
                    snail.innerText = '🐌'; 
                    
                    // Aggiungo il nome vicino alla lumaca
                    const nameTag = document.createElement('span');
                    nameTag.style.position = 'absolute';
                    nameTag.style.top = '-20px';
                    nameTag.style.fontSize = '14px';
                    nameTag.style.color = 'black';
                    nameTag.style.textShadow = 'none';
                    nameTag.innerText = p.name;
                    snail.appendChild(nameTag);

                    let progressPercent = (p.score / maxScore) * 100;
                    if (progressPercent > 90) progressPercent = 90; 
                    
                    snail.style.left = `calc(${progressPercent}% - 50px)`;
                    
                    track.appendChild(snail);
                    raceTrack.appendChild(track);

                    if (p.score >= maxScore && !raceFinished) {
                        raceFinished = true;
                        db.ref('rooms/' + hostRoomId + '/status').set('finished');
                        document.getElementById('winner-text').innerText = `🏆 HA VINTO ${p.name.toUpperCase()}! 🏆`;
                        document.getElementById('start-btn').style.display = 'none';
                    }
                });
            });

            // Chiude la stanza quando si chiude la pagina
            window.onbeforeunload = function() {
                db.ref('rooms/' + hostRoomId).remove();
            };
        }

        function startRaceHost() {
            db.ref('rooms/' + hostRoomId + '/status').set('playing');
            document.getElementById('start-btn').style.display = 'none';
            document.getElementById('winner-text').innerText = "GARA IN CORSO!";
        }

        // ================= FUNZIONI CLIENT =================
        let clientRoomId;
        let playerId;
        let selectedColor = '#ff0000'; // Default rosso
        let myScore = 0;
        let raceStatus = 'waiting';

        function initClient(roomStr) {
            clientRoomId = roomStr;
            playerId = 'player_' + Math.random().toString(36).substr(2, 9);
            
            // Genera pulsanti colore visivi
            const colors = ['#ff0000', '#0000ff', '#ff69b4', '#800080', '#ffa500', '#000000', '#00cc00', '#00cccc'];
            const container = document.getElementById('color-container');
            
            colors.forEach(c => {
                const div = document.createElement('div');
                div.className = 'color-option';
                if (c === '#ff0000') div.classList.add('selected'); // Rosso selezionato di base
                div.style.backgroundColor = c;
                div.innerText = '🐌';
                div.onclick = function() {
                    // Rimuove la selezione dagli altri
                    document.querySelectorAll('.color-option').forEach(el => el.classList.remove('selected'));
                    div.classList.add('selected');
                    selectedColor = c;
                };
                container.appendChild(div);
            });

            // Ascolta lo stato della gara
            db.ref(`rooms/${clientRoomId}/status`).on('value', (snap) => {
                raceStatus = snap.val();
                const statusText = document.getElementById('game-status-text');
                if (raceStatus === 'waiting') {
                    statusText.innerText = "In attesa che l'Host avvii la gara...";
                    statusText.style.color = "#d35400";
                } else if (raceStatus === 'playing') {
                    statusText.innerText = "🔥 VIA!!! URLA PIÙ FORTE CHE PUOI! 🔥";
                    statusText.style.color = "#27ae60";
                } else if (raceStatus === 'finished') {
                    statusText.innerText = "🏁 GARA FINITA! Guarda lo schermo! 🏁";
                    statusText.style.color = "#c0392b";
                }
            });
        }

        async function joinGameClient() {
            const name = document.getElementById('playerName').value;
            if (!name) return alert("Inserisci un nome per la tua lumaca!");

            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                
                document.getElementById('login-screen').style.display = 'none';
                document.getElementById('game-screen').style.display = 'block';

                db.ref(`rooms/${clientRoomId}/players/${playerId}`).set({
                    name: name,
                    color: selectedColor,
                    score: 0
                });

                startListening(stream);
                trackRankings();

            } catch (err) {
                alert("Devi consentire l'accesso al microfono per giocare!");
            }
        }

        function startListening(stream) {
            const audioContext = new (window.AudioContext || window.webkitAudioContext)();
            const analyser = audioContext.createAnalyser();
            const microphone = audioContext.createMediaStreamSource(stream);
            
            microphone.connect(analyser);
            analyser.fftSize = 256;
            const bufferLength = analyser.frequencyBinCount;
            const dataArray = new Uint8Array(bufferLength);
            
            const snailEmoji = document.getElementById('my-snail');

            setInterval(() => {
                analyser.getByteFrequencyData(dataArray);
                let sum = 0;
                for(let i = 0; i < bufferLength; i++) { sum += dataArray[i]; }
                let volume = sum / bufferLength;

                // SI MUOVE SOLO SE LA GARA È IN CORSO ("playing")
                if (volume > 20 && raceStatus === 'playing') {
                    myScore += (volume / 2); 
                    if (myScore > maxScore) myScore = maxScore;

                    db.ref(`rooms/${clientRoomId}/players/${playerId}/score`).set(myScore);

                    let progressPercent = (myScore / maxScore) * 100;
                    document.getElementById('progress').style.width = progressPercent + '%';
                    document.getElementById('distance-text').innerText = `Strada percorsa: ${Math.floor(progressPercent)}%`;
                    
                    snailEmoji.style.transform = `scale(${1 + (volume/100)}) rotate(${(Math.random() * 10) - 5}deg)`;
                } else {
                    snailEmoji.style.transform = "scale(1) rotate(0deg)";
                }
            }, 100);
        }

        function trackRankings() {
            db.ref(`rooms/${clientRoomId}/players`).on('value', (snapshot) => {
                const players = snapshot.val();
                if (!players) return;

                let leaderboard = [];
                for (let key in players) {
                    leaderboard.push({ id: key, score: players[key].score });
                }
                
                leaderboard.sort((a, b) => b.score - a.score);
                const myRank = leaderboard.findIndex(p => p.id === playerId) + 1;
                document.getElementById('rank-display').innerText = `Posizione: ${myRank}°`;
            });
        }
    </script>
</body>
</html>
