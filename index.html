<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Corsa delle Lumache</title>
  <link href__="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #f4faf4;
      --fg: #122a1c;
      --primary: hsl(142, 50%, 42%);
      --primary-light: hsl(142, 50%, 90%);
      --secondary: hsl(36, 80%, 55%);
      --muted: #e8f3e8;
      --muted-fg: #6b8f7a;
      --card: #ffffff;
      --border: #cce0cc;
      --radius: 1rem;
    }

    body {
      font-family: 'Nunito', sans-serif;
      background: var(--bg);
      color: var(--fg);
      min-height: 100svh;
      display: flex;
      flex-direction: column;
    }

    h1, h2, h3, .fredoka { font-family: 'Fredoka', sans-serif; }

    /* ── HEADER ── */
    .header {
      background: linear-gradient(90deg, hsl(142,50%,42%,0.12), hsl(36,80%,55%,0.12));
      border-bottom: 1px solid var(--border);
      padding: 1rem;
      text-align: center;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
    }
    .header h1 { font-size: 1.25rem; font-family: 'Fredoka', sans-serif; }

    /* ── MAIN ── */
    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      position: relative;
    }

    /* ── CARD ── */
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1.5rem;
    }

    /* ── STEP CONTAINER ── */
    .step { width: 100%; max-width: 22rem; }

    /* ── BUTTON ── */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      font-family: 'Fredoka', sans-serif;
      font-size: 1.1rem;
      font-weight: 600;
      border: none;
      border-radius: var(--radius);
      cursor: pointer;
      transition: opacity 0.15s, transform 0.1s;
      padding: 0.9rem 1.5rem;
      width: 100%;
      background: var(--primary);
      color: #fff;
      box-shadow: 0 4px 12px rgba(39,174,96,0.3);
    }
    .btn:hover { opacity: 0.88; }
    .btn:active { transform: scale(0.97); }
    .btn:disabled { opacity: 0.45; cursor: not-allowed; }
    .btn-outline {
      background: transparent;
      color: var(--primary);
      border: 2px solid var(--primary);
      box-shadow: none;
    }

    /* ── INPUT ── */
    .input {
      width: 100%;
      padding: 0.75rem 1rem;
      font-family: 'Nunito', sans-serif;
      font-size: 1rem;
      border: 1px solid var(--border);
      border-radius: 0.75rem;
      background: var(--bg);
      color: var(--fg);
      outline: none;
      transition: border-color 0.2s;
    }
    .input:focus { border-color: var(--primary); }

    /* ── LABEL ── */
    .label {
      font-family: 'Fredoka', sans-serif;
      font-size: 0.9rem;
      margin-bottom: 0.4rem;
      display: block;
    }

    /* ── COLOR GRID ── */
    .color-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 0.75rem;
    }
    .color-btn {
      background: none;
      border: 2px solid transparent;
      border-radius: 1rem;
      padding: 0.4rem;
      cursor: pointer;
      transition: border-color 0.15s, transform 0.15s;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.25rem;
    }
    .color-btn.selected { border-color: var(--primary); transform: scale(1.07); box-shadow: 0 2px 8px rgba(39,174,96,0.25); }
    .color-btn span { font-size: 0.65rem; color: var(--muted-fg); text-transform: capitalize; }

    /* ── PREVIEW BOX ── */
    .preview-box {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 1.5rem;
      padding: 1.5rem;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.5rem;
    }

    /* ── SPACE UTILS ── */
    .space-y-2 > * + * { margin-top: 0.5rem; }
    .space-y-3 > * + * { margin-top: 0.75rem; }
    .space-y-6 > * + * { margin-top: 1.5rem; }
    .space-y-8 > * + * { margin-top: 2rem; }
    .mt-2 { margin-top: 0.5rem; }
    .mt-3 { margin-top: 0.75rem; }
    .text-center { text-align: center; }
    .text-sm { font-size: 0.875rem; }
    .muted { color: var(--muted-fg); }

    /* ── WAITING DOTS ── */
    .dots { display: flex; gap: 0.5rem; justify-content: center; }
    .dot {
      width: 0.5rem; height: 0.5rem;
      background: var(--primary);
      border-radius: 50%;
      animation: bounce 0.8s infinite alternate;
    }
    .dot:nth-child(2) { animation-delay: 0.15s; }
    .dot:nth-child(3) { animation-delay: 0.3s; }
    @keyframes bounce { to { transform: translateY(-8px); } }

    /* ── TRACK ── */
    .track-wrap { width: 100%; }
    .track-labels {
      display: flex;
      justify-content: space-between;
      font-size: 0.75rem;
      color: var(--muted-fg);
      margin-bottom: 0.25rem;
    }
    .track-bg {
      position: relative;
      height: 1.5rem;
      background: var(--muted);
      border-radius: 999px;
      overflow: hidden;
      border: 1px solid var(--border);
    }
    .track-fill {
      position: absolute;
      left: 0; top: 0; bottom: 0;
      background: linear-gradient(90deg, var(--primary), hsl(142,50%,60%));
      border-radius: 999px;
      transition: width 0.08s linear;
    }
    .track-snail {
      position: absolute;
      top: 50%;
      transform: translate(-50%, -50%);
      font-size: 1.1rem;
      transition: left 0.08s linear;
    }

    /* ── SCORE BOX ── */
    .score-box {
      background: linear-gradient(135deg, hsl(142,50%,42%,0.1), hsl(36,80%,55%,0.1));
      border: 1px solid hsl(142,50%,42%,0.2);
      border-radius: 1rem;
      padding: 1rem;
      text-align: center;
    }
    .score-num {
      font-family: 'Fredoka', sans-serif;
      font-size: 3.5rem;
      font-weight: 700;
      color: var(--primary);
      line-height: 1;
    }

    /* ── MIC ── */
    .mic-wrap { text-align: center; }
    .mic-icon-wrap {
      width: 5rem; height: 5rem;
      border-radius: 50%;
      background: hsl(142,50%,42%,0.1);
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto 1rem;
    }
    .mic-icon { font-size: 2.5rem; }
    .bars { display: flex; align-items: flex-end; justify-content: center; gap: 0.25rem; height: 5rem; }
    .bar {
      width: 1rem;
      border-radius: 999px;
      background: var(--muted);
      transition: height 0.06s linear, background 0.06s linear;
      min-height: 0.5rem;
    }
    .mic-status {
      display: flex; align-items: center; justify-content: center; gap: 0.5rem;
      margin-top: 0.5rem;
    }
    .mic-dot {
      width: 0.75rem; height: 0.75rem;
      border-radius: 50%;
      background: var(--muted-fg);
    }
    .mic-dot.active { background: var(--primary); animation: pulse 1s infinite; }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }

    /* ── FINISHED FLAG ── */
    .flag-anim { font-size: 4rem; display: inline-block; animation: wiggle 1s 3; }
    @keyframes wiggle {
      0%,100%{transform:rotate(0)} 25%{transform:rotate(10deg)} 75%{transform:rotate(-10deg)}
    }

    /* ── PULSE TEXT ── */
    .pulse-text { animation: textpulse 2s infinite; }
    @keyframes textpulse { 0%,100%{opacity:1} 50%{opacity:0.5} }

    /* ── NO SESSION ── */
    .no-session { text-align: center; padding: 2rem; }
    .no-session .big-icon { font-size: 4rem; margin-bottom: 1rem; }

    /* ── RACING BG PARTICLES ── */
    .particles { position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: 0; }
    .particle {
      position: absolute;
      border-radius: 50%;
      opacity: 0.2;
      animation: floatUp 3s ease-in-out infinite;
    }
    @keyframes floatUp {
      0%,100%{ transform: translateY(0) scale(1); }
      50%{ transform: translateY(-20px) scale(1.3); }
    }
    .main > * { position: relative; z-index: 1; }

    /* ── RACING BG ── */
    body.racing { background: linear-gradient(to bottom, hsl(142,50%,97%), hsl(36,80%,97%)); }

    /* ── FADE IN ── */
    @keyframes fadeIn { from { opacity:0; transform: translateY(12px); } to { opacity:1; transform: translateY(0); } }
    .fade-in { animation: fadeIn 0.35s ease both; }
  </style>
</head>
<body>

<!-- HEADER -->
<div class="header">
  <span style="font-size:1.5rem">🐌</span>
  <h1>Corsa delle Lumache</h1>
</div>

<!-- MAIN -->
<main class="main" id="main">
  <div id="app"></div>
</main>

<!-- PARTICLES (shown during racing) -->
<div class="particles" id="particles" style="display:none"></div>

<script>
// ─────────────────────────────────────────────
//  CONFIG & STATE
// ─────────────────────────────────────────────
const COLORS = ['red','blue','green','purple','orange','pink','yellow','cyan'];
const SNAIL_COLORS = {
  red:    { shell1:'#c0392b', shell2:'#e74c3c', shell3:'#ff6b6b', body1:'#e67e22', body2:'#f39c12' },
  blue:   { shell1:'#1a5276', shell2:'#2980b9', shell3:'#5dade2', body1:'#1e8bc3', body2:'#3498db' },
  green:  { shell1:'#1e8449', shell2:'#27ae60', shell3:'#58d68d', body1:'#27ae60', body2:'#2ecc71' },
  purple: { shell1:'#6c3483', shell2:'#8e44ad', shell3:'#bb8fce', body1:'#7d3c98', body2:'#9b59b6' },
  orange: { shell1:'#ba4a00', shell2:'#e67e22', shell3:'#f0b27a', body1:'#ca6f1e', body2:'#f39c12' },
  pink:   { shell1:'#a93226', shell2:'#e91e8c', shell3:'#f48fb1', body1:'#c2185b', body2:'#e91e8c' },
  yellow: { shell1:'#9a7d0a', shell2:'#d4ac0d', shell3:'#f7dc6f', body1:'#b7950b', body2:'#f1c40f' },
  cyan:   { shell1:'#0e6655', shell2:'#17a589', shell3:'#76d7c4', body1:'#148f77', body2:'#1abc9c' },
};

const params = new URLSearchParams(window.location.search);
const SESSION_ID = params.get('session');
const LEGACY_RACE_ID = params.get('race');

// App state
let step = 'setup';           // setup | waiting | racing | finished
let nameInput = '';
let colorInput = 'green';
let session = null;
let currentRaceId = LEGACY_RACE_ID || null;
let race = null;
let participants = [];
let participantId = null;
let myName = '';
let myColor = 'green';

// Refs (mutable, not tied to re-render)
let volumeVal = 0;
let positionVal = 0;
let lastSaveTime = 0;
let raceStatusVal = 'waiting';
let trackLengthVal = 5000;
let finishFired = false;
let displayPosition = 0;

// Loop handles
let movementRafId = null;
let saveIntervalId = null;
let displayIntervalId = null;

// Subscriptions
let unsubSession = null;
let unsubRace = null;
let unsubParticipants = null;

// Mic
let micActive = false;
let micStream = null;
let micAudioCtx = null;
let micAnalyser = null;
let micRafId = null;
let permissionDenied = false;

// ─────────────────────────────────────────────
//  BASE44 SDK LOADER
// ─────────────────────────────────────────────
// We load Base44 SDK from the page's own context via a tiny bridge
// Because this is a standalone HTML, we use fetch to call the Base44 REST API directly.
// The app ID is extracted from the current URL.

// ── Extract appId from the preview URL  ──────
// Preview URLs are: https://preview-sandbox--<appId>.base44.app
// or the published URL if custom domain. We grab it from meta or derive it.
function getAppId() {
  // Try to read from a meta tag injected by Base44 (not always present in standalone)
  const meta = document.querySelector('meta[name="base44-app-id"]');
  if (meta) return meta.content;
  // Try to derive from hostname: preview-sandbox--<appId>.base44.app
  const match = window.location.hostname.match(/--([a-f0-9]+)\.base44\.app/);
  if (match) return match[1];
  return null;
}

const APP_ID = getAppId();
const API_BASE = `https://api.base44.com/api/apps/${APP_ID}`;

// Simple in-memory entity cache keyed by entity+id
const _cache = {};

// Auth token (from cookie or localStorage – Base44 sets it automatically)
function getAuthToken() {
  // Base44 stores the token in a cookie named 'base44_token' or similar
  const cookieMatch = document.cookie.match(/(?:^|;\s*)base44_token=([^;]+)/);
  if (cookieMatch) return decodeURIComponent(cookieMatch[1]);
  return localStorage.getItem('base44_auth_token') || '';
}

async function apiRequest(method, path, body) {
  const token = getAuthToken();
  const res = await fetch(`${API_BASE}${path}`, {
    method,
    headers: {
      'Content-Type': 'application/json',
      ...(token ? { Authorization: `Bearer ${token}` } : {}),
    },
    ...(body ? { body: JSON.stringify(body) } : {}),
  });
  if (!res.ok) throw new Error(`API ${method} ${path} failed: ${res.status}`);
  return res.json();
}

// Entity helpers
const entities = {
  filter: (entity, query) => apiRequest('POST', `/entities/${entity}/query`, { filters: query }),
  create: (entity, data) => apiRequest('POST', `/entities/${entity}`, data),
  update: (entity, id, data) => apiRequest('PATCH', `/entities/${entity}/${id}`, data),
};

// Real-time subscribe via polling (since standalone HTML can't use SDK WebSocket)
function subscribePolled(entity, callback, intervalMs = 1500) {
  let lastSeen = {};
  let stopped = false;
  async function poll() {
    if (stopped) return;
    try {
      const list = await apiRequest('GET', `/entities/${entity}`);
      list.forEach(item => {
        const prev = lastSeen[item.id];
        if (!prev) {
          callback({ type: 'create', id: item.id, data: item });
        } else if (prev.updated_date !== item.updated_date) {
          callback({ type: 'update', id: item.id, data: item });
        }
        lastSeen[item.id] = item;
      });
      // detect deletes
      Object.keys(lastSeen).forEach(id => {
        if (!list.find(i => i.id === id)) {
          callback({ type: 'delete', id, data: null });
          delete lastSeen[id];
        }
      });
    } catch(e) { /* ignore */ }
    if (!stopped) setTimeout(poll, intervalMs);
  }
  poll();
  return () => { stopped = true; };
}

// ─────────────────────────────────────────────
//  SVG SNAIL
// ─────────────────────────────────────────────
function snailSVG(color, size) {
  const c = SNAIL_COLORS[color] || SNAIL_COLORS.green;
  const w = size, h = size * 0.75;
  return `<svg viewBox="0 0 100 75" width="${w}" height="${h}" style="overflow:visible">
    <defs>
      <filter id="sh-${color}"><feDropShadow dx="1" dy="2" stdDeviation="2" flood-color="#00000044"/></filter>
      <radialGradient id="sg-${color}" cx="35%" cy="30%" r="65%">
        <stop offset="0%" stop-color="${c.shell3}"/>
        <stop offset="50%" stop-color="${c.shell2}"/>
        <stop offset="100%" stop-color="${c.shell1}"/>
      </radialGradient>
      <linearGradient id="bg-${color}" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="${c.body2}"/>
        <stop offset="100%" stop-color="${c.body1}"/>
      </linearGradient>
      <radialGradient id="sdw-${color}" cx="50%" cy="50%" r="50%">
        <stop offset="0%" stop-color="#00000033"/>
        <stop offset="100%" stop-color="#00000000"/>
      </radialGradient>
    </defs>
    <ellipse cx="52" cy="72" rx="28" ry="5" fill="url(#sdw-${color})"/>
    <ellipse cx="38" cy="58" rx="28" ry="10" fill="url(#bg-${color})" filter="url(#sh-${color})"/>
    <ellipse cx="36" cy="55" rx="18" ry="5" fill="${c.body2}" opacity="0.35"/>
    <ellipse cx="16" cy="54" rx="12" ry="10" fill="url(#bg-${color})"/>
    <ellipse cx="13" cy="51" rx="7" ry="5" fill="${c.body2}" opacity="0.4"/>
    <ellipse cx="52" cy="44" rx="26" ry="24" fill="url(#sg-${color})" filter="url(#sh-${color})"/>
    <path d="M52,26 Q68,30 68,44 Q68,58 52,62 Q36,62 36,48 Q36,36 48,32" fill="none" stroke="${c.shell1}" stroke-width="2.5" stroke-linecap="round" opacity="0.7"/>
    <path d="M52,34 Q62,37 62,44 Q62,54 52,56 Q42,54 42,46 Q42,38 50,36" fill="none" stroke="${c.shell1}" stroke-width="1.5" stroke-linecap="round" opacity="0.5"/>
    <circle cx="53" cy="44" r="5" fill="${c.shell2}" opacity="0.6"/>
    <circle cx="53" cy="44" r="2.5" fill="${c.shell3}" opacity="0.8"/>
    <ellipse cx="42" cy="33" rx="7" ry="5" fill="white" opacity="0.3" transform="rotate(-20,42,33)"/>
    <ellipse cx="40" cy="31" rx="3" ry="2" fill="white" opacity="0.5" transform="rotate(-20,40,31)"/>
    <line x1="11" y1="47" x2="7" y2="36" stroke="${c.body1}" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="19" y1="46" x2="17" y2="35" stroke="${c.body1}" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="7" cy="34" r="4" fill="${c.body2}" stroke="${c.body1}" stroke-width="1"/>
    <circle cx="17" cy="33" r="4" fill="${c.body2}" stroke="${c.body1}" stroke-width="1"/>
    <circle cx="7" cy="34" r="2" fill="#2c3e50"/>
    <circle cx="17" cy="33" r="2" fill="#2c3e50"/>
    <circle cx="7.8" cy="33.2" r="0.8" fill="white"/>
    <circle cx="17.8" cy="32.2" r="0.8" fill="white"/>
    <path d="M12,60 Q16,64 22,60" fill="none" stroke="${c.body1}" stroke-width="1.5" stroke-linecap="round"/>
    <circle cx="7" cy="30" r="2" fill="${c.shell2}" stroke="${c.shell1}" stroke-width="0.5"/>
    <circle cx="17" cy="29" r="2" fill="${c.shell2}" stroke="${c.shell1}" stroke-width="0.5"/>
  </svg>`;
}

// ─────────────────────────────────────────────
//  RENDER FUNCTIONS
// ─────────────────────────────────────────────
function render() {
  const app = document.getElementById('app');
  const particles = document.getElementById('particles');

  // Particles during racing
  if (step === 'racing') {
    document.body.classList.add('racing');
    particles.style.display = 'block';
    if (!particles.children.length) buildParticles(particles);
  } else {
    document.body.classList.remove('racing');
    particles.style.display = 'none';
  }

  if (!SESSION_ID && !LEGACY_RACE_ID) {
    app.innerHTML = `
      <div class="no-session fade-in">
        <div class="big-icon">🐌</div>
        <h2 class="fredoka" style="font-size:1.4rem;margin-bottom:0.5rem">Nessuna gara trovata</h2>
        <p class="muted text-sm">Scansiona il QR Code dello schermo dell'host per unirti a una gara.</p>
      </div>`;
    return;
  }

  const displayName = myName || nameInput;
  const displayColor = myColor || colorInput;
  const tl = race?.track_length || trackLengthVal;
  const progress = Math.min((displayPosition / tl) * 100, 100);
  const myScore = Math.round((displayPosition / tl) * 1000);

  if (step === 'setup') {
    app.innerHTML = `
      <div class="step fade-in">
        <div class="text-center space-y-2" style="margin-bottom:2rem">
          <h2 class="fredoka" style="font-size:1.6rem">Crea la tua Lumaca!</h2>
          <p class="muted text-sm">Scegli un nome e un colore</p>
        </div>
        <div class="space-y-6">
          <div class="space-y-2">
            <label class="label">Nome della lumaca</label>
            <input id="nameInput" class="input" placeholder="es. Turbo, Flash, Speedy..." maxlength="20" value="${escHtml(nameInput)}" />
          </div>
          <div class="space-y-3">
            <label class="label">Colore del vestito</label>
            <div class="color-grid">
              ${COLORS.map(c => `
                <button class="color-btn ${colorInput === c ? 'selected' : ''}" data-color="${c}">
                  ${snailSVG(c, 40)}
                  <span>${c}</span>
                </button>`).join('')}
            </div>
          </div>
          <div class="preview-box">
            ${snailSVG(colorInput, 80)}
            <p class="fredoka" style="font-size:1.1rem;margin-top:0.5rem">${escHtml(nameInput) || '???'}</p>
          </div>
          <button class="btn" id="joinBtn" ${!nameInput.trim() ? 'disabled' : ''}>🐌 Unisciti alla Gara!</button>
        </div>
      </div>`;

    document.getElementById('nameInput').addEventListener('input', e => {
      nameInput = e.target.value;
      // live update preview & button
      document.querySelector('.preview-box p').textContent = nameInput || '???';
      document.getElementById('joinBtn').disabled = !nameInput.trim();
    });
    document.querySelectorAll('.color-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        colorInput = btn.dataset.color;
        render();
      });
    });
    document.getElementById('joinBtn').addEventListener('click', joinRace);
  }

  else if (step === 'waiting') {
    app.innerHTML = `
      <div class="step text-center fade-in" style="display:flex;flex-direction:column;align-items:center;gap:2rem">
        <div>${snailSVG(displayColor, 100)}</div>
        <div>
          <h2 class="fredoka" style="font-size:1.5rem">${escHtml(displayName)}</h2>
          <p class="muted mt-2">In attesa che l'host avvii la gara...</p>
        </div>
        <div class="dots"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>
      </div>`;
  }

  else if (step === 'racing') {
    app.innerHTML = `
      <div class="step fade-in space-y-6">
        <div class="text-center">
          <div style="display:flex;justify-content:center">${snailSVG(displayColor, 80)}</div>
          <h2 class="fredoka" style="font-size:1.2rem;margin-top:0.5rem">${escHtml(displayName)}</h2>
          <div class="score-box mt-3">
            <div class="score-num" id="scoreNum">${myScore}</div>
            <p class="muted text-sm">punti</p>
          </div>
        </div>
        <div class="card">
          ${trackHTML(progress)}
        </div>
        <div class="card">
          <div class="mic-wrap" id="micWrap">
            ${micActive ? activeMicHTML() : inactiveMicHTML()}
          </div>
        </div>
      </div>`;

    if (!micActive) {
      document.getElementById('startMicBtn')?.addEventListener('click', startMic);
    }
  }

  else if (step === 'finished') {
    app.innerHTML = `
      <div class="step text-center fade-in space-y-6" style="display:flex;flex-direction:column;align-items:center">
        <div class="flag-anim">🏁</div>
        <div>${snailSVG(displayColor, 80)}</div>
        <h2 class="fredoka" style="font-size:2rem;font-weight:700">${escHtml(displayName)}</h2>
        <div class="score-box" style="width:100%">
          <div class="score-num" style="font-size:4rem">${myScore}</div>
          <p class="muted">punti questa gara</p>
        </div>
        <div class="card" style="width:100%">${trackHTML(progress)}</div>
        <p class="muted text-sm pulse-text">In attesa della prossima gara... 👀</p>
      </div>`;
  }
}

function trackHTML(progress) {
  const pct = Math.min(progress, 100);
  const snailLeft = Math.min(pct, 94);
  return `
    <div class="track-wrap">
      <div class="track-labels">
        <span>Partenza</span>
        <span>${Math.round(pct)}%</span>
        <span>🏁 Arrivo</span>
      </div>
      <div class="track-bg">
        <div class="track-fill" id="trackFill" style="width:${pct}%"></div>
        <div class="track-snail" id="trackSnail" style="left:calc(${snailLeft}% - 8px)">🐌</div>
      </div>
    </div>`;
}

function inactiveMicHTML() {
  return `
    <div class="text-center" style="display:flex;flex-direction:column;align-items:center;gap:1rem">
      <div class="mic-icon-wrap"><div class="mic-icon">🎤</div></div>
      <button class="btn" id="startMicBtn" style="max-width:16rem">🎤 Attiva Microfono</button>
      ${permissionDenied ? '<p style="color:var(--destructive,#e74c3c);font-size:0.85rem">Accesso al microfono negato. Controlla i permessi del browser.</p>' : ''}
    </div>`;
}

function activeMicHTML() {
  const barCount = 12;
  const bars = Array.from({length: barCount}, (_,i) => `<div class="bar" id="bar${i}" style="height:0.5rem"></div>`).join('');
  return `
    <div class="text-center">
      <p class="fredoka" style="font-size:1rem;margin-bottom:0.75rem">GRIDA PER FAR CORRERE LA TUA LUMACA! 🐌💨</p>
      <div class="bars">${bars}</div>
      <div class="mic-status">
        <div class="mic-dot active" id="micDot"></div>
        <span class="muted text-sm" id="micLabel">In attesa...</span>
      </div>
    </div>`;
}

function buildParticles(container) {
  const colors = ['#27ae60','#f39c12','#9b59b6','#3498db','#e74c3c','#1abc9c','#e67e22','#e91e8c'];
  colors.forEach((bg, i) => {
    const size = 8 + (i % 3) * 6;
    const div = document.createElement('div');
    div.className = 'particle';
    div.style.cssText = `
      width:${size}px;height:${size}px;
      left:${10+i*11}%;top:${20+(i%4)*15}%;
      background:${bg};
      animation-duration:${2+i*0.4}s;
      animation-delay:${i*0.3}s;
    `;
    container.appendChild(div);
  });
}

function escHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ─────────────────────────────────────────────
//  TRACK UPDATE (no full re-render during racing)
// ─────────────────────────────────────────────
function updateTrackDOM() {
  const tl = trackLengthVal;
  const pct = Math.min((displayPosition / tl) * 100, 100);
  const snailLeft = Math.min(pct, 94);
  const fill = document.getElementById('trackFill');
  const snail = document.getElementById('trackSnail');
  const scoreEl = document.getElementById('scoreNum');
  if (fill) fill.style.width = pct + '%';
  if (snail) snail.style.left = `calc(${snailLeft}% - 8px)`;
  if (scoreEl) scoreEl.textContent = Math.round((displayPosition / tl) * 1000);
}

function updateBarsDOM(vol) {
  const barCount = 12;
  for (let i = 0; i < barCount; i++) {
    const el = document.getElementById('bar' + i);
    if (!el) continue;
    const threshold = i / barCount;
    const active = vol > threshold;
    const height = active ? 20 + (i / barCount) * 60 : 8;
    el.style.height = height + 'px';
    if (active) {
      el.style.background = vol > 0.7 ? 'hsl(0,80%,55%)' : vol > 0.4 ? 'hsl(36,80%,55%)' : 'hsl(142,50%,42%)';
    } else {
      el.style.background = 'hsl(120,15%,90%)';
    }
  }
  const label = document.getElementById('micLabel');
  if (label) {
    label.textContent = vol < 0.1 ? 'In attesa...' : vol < 0.4 ? 'Più forte!' : vol < 0.7 ? 'Bene!' : 'FANTASTICO! 🔥';
  }
}

// ─────────────────────────────────────────────
//  MIC
// ─────────────────────────────────────────────
async function startMic() {
  try {
    micStream = await navigator.mediaDevices.getUserMedia({ audio: true });
    micAudioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const source = micAudioCtx.createMediaStreamSource(micStream);
    micAnalyser = micAudioCtx.createAnalyser();
    micAnalyser.fftSize = 256;
    micAnalyser.smoothingTimeConstant = 0.3;
    source.connect(micAnalyser);
    micActive = true;
    permissionDenied = false;

    const data = new Uint8Array(micAnalyser.frequencyBinCount);
    function readMic() {
      micAnalyser.getByteFrequencyData(data);
      let sum = 0;
      for (let i = 0; i < data.length; i++) sum += data[i];
      const normalized = Math.min(sum / data.length / 80, 1);
      volumeVal = normalized;
      updateBarsDOM(normalized);
      micRafId = requestAnimationFrame(readMic);
    }
    readMic();
    // Re-render the mic section only
    const micWrap = document.getElementById('micWrap');
    if (micWrap) {
      micWrap.innerHTML = activeMicHTML();
    }
  } catch(err) {
    permissionDenied = true;
    const micWrap = document.getElementById('micWrap');
    if (micWrap) micWrap.innerHTML = inactiveMicHTML();
    document.getElementById('startMicBtn')?.addEventListener('click', startMic);
  }
}

function stopMic() {
  if (micRafId) cancelAnimationFrame(micRafId);
  micStream?.getTracks().forEach(t => t.stop());
  micAudioCtx?.close();
  micActive = false;
  volumeVal = 0;
}

// ─────────────────────────────────────────────
//  GAME LOOP
// ─────────────────────────────────────────────
function startGameLoop() {
  stopGameLoop();
  let lastTime = null;

  function movementLoop(ts) {
    if (lastTime !== null) {
      const delta = (ts - lastTime) / 1000;
      if (volumeVal >= 0.05) {
        const speed = volumeVal * 300;
        positionVal = Math.min(positionVal + speed * delta, trackLengthVal);
      }
    }
    lastTime = ts;
    movementRafId = requestAnimationFrame(movementLoop);
  }
  movementRafId = requestAnimationFrame(movementLoop);

  saveIntervalId = setInterval(() => {
    const newPos = positionVal;
    const finished = newPos >= trackLengthVal;
    if (!participantId || !currentRaceId) return;

    entities.update('RaceParticipant', participantId, {
      position: newPos,
      finished,
      ...(finished ? { finish_time: new Date().toISOString() } : {}),
    });

    if (finished && !finishFired) {
      finishFired = true;
      entities.update('Race', currentRaceId, { status: 'finished', winner_id: participantId });
    }
  }, 200);

  displayIntervalId = setInterval(() => {
    displayPosition = positionVal;
    updateTrackDOM();
  }, 33);
}

function stopGameLoop() {
  if (movementRafId) { cancelAnimationFrame(movementRafId); movementRafId = null; }
  if (saveIntervalId) { clearInterval(saveIntervalId); saveIntervalId = null; }
  if (displayIntervalId) { clearInterval(displayIntervalId); displayIntervalId = null; }
}

// ─────────────────────────────────────────────
//  JOIN RACE
// ─────────────────────────────────────────────
async function joinRace() {
  const trimmed = nameInput.trim();
  if (!trimmed || !currentRaceId) return;
  const participant = await entities.create('RaceParticipant', {
    race_id: currentRaceId,
    name: trimmed,
    color: colorInput,
    position: 0,
    finished: false,
  });
  participantId = participant.id;
  myName = trimmed;
  myColor = colorInput;
  setStep('waiting');
}

// ─────────────────────────────────────────────
//  STEP MANAGEMENT
// ─────────────────────────────────────────────
function setStep(newStep) {
  if (step === 'racing' && newStep !== 'racing') {
    stopGameLoop();
  }
  if (step !== 'racing' && newStep === 'racing') {
    positionVal = 0;
    displayPosition = 0;
    startGameLoop();
  }
  step = newStep;
  render();
}

// ─────────────────────────────────────────────
//  SUBSCRIPTIONS
// ─────────────────────────────────────────────
function subscribeToRace(raceId) {
  if (unsubRace) unsubRace();
  if (unsubParticipants) unsubParticipants();

  unsubRace = subscribePolled('Race', event => {
    if (event.id !== raceId) return;
    if (event.type === 'update') {
      race = event.data;
      trackLengthVal = race.track_length || 5000;
      raceStatusVal = race.status;

      if (race.status === 'racing' && (step === 'waiting' || step === 'finished')) setStep('racing');
      if (race.status === 'finished' && step === 'racing') setStep('finished');
    }
  }, 1000);

  unsubParticipants = subscribePolled('RaceParticipant', event => {
    if (event.data?.race_id !== raceId) return;
    if (event.type === 'create') {
      if (!participants.find(p => p.id === event.id)) participants.push(event.data);
    } else if (event.type === 'update') {
      participants = participants.map(p => p.id === event.id ? event.data : p);
    } else if (event.type === 'delete') {
      participants = participants.filter(p => p.id !== event.id);
    }
  }, 1000);
}

function switchRace(newRaceId) {
  if (!newRaceId || newRaceId === currentRaceId) return;
  currentRaceId = newRaceId;
  finishFired = false;
  positionVal = 0;
  displayPosition = 0;
  raceStatusVal = 'waiting';
  race = null;
  participants = [];
  participantId = null;

  // Load race
  entities.filter('Race', { id: newRaceId }).then(list => {
    if (list[0]) {
      race = list[0];
      trackLengthVal = race.track_length || 5000;
    }
  });

  // Find our slot (host copies participants between races)
  let pollCount = 0;
  function findMySlot() {
    entities.filter('RaceParticipant', { race_id: newRaceId }).then(list => {
      participants = list;
      if (myName) {
        const mine = list.find(p => p.name === myName && p.color === myColor);
        if (mine) {
          participantId = mine.id;
          positionVal = 0;
          if (step !== 'setup') setStep('waiting');
        } else if (pollCount < 10) {
          pollCount++;
          setTimeout(findMySlot, 500);
        }
      }
    });
  }
  findMySlot();
  subscribeToRace(newRaceId);
}

// ─────────────────────────────────────────────
//  INIT
// ─────────────────────────────────────────────
async function init() {
  render();

  if (!SESSION_ID && !LEGACY_RACE_ID) return;

  if (SESSION_ID) {
    // Load session
    const sessions = await entities.filter('Session', { id: SESSION_ID });
    if (sessions[0]) {
      session = sessions[0];
      if (session.current_race_id) switchRace(session.current_race_id);
    }

    // Subscribe to session updates
    unsubSession = subscribePolled('Session', event => {
      if (event.id !== SESSION_ID) return;
      if (event.type === 'update') {
        session = event.data;
        if (session.current_race_id && session.current_race_id !== currentRaceId) {
          switchRace(session.current_race_id);
        }
      }
    }, 1500);
  } else if (LEGACY_RACE_ID) {
    switchRace(LEGACY_RACE_ID);
  }
}

init();
</script>
